[bar]
order = [ "default" ]

    [bar.default]
    capsule_fill = "on_primary"
    capsule_foreground = "on_surface"
    capsule_opacity = 0.36999999172985554
    capsule_padding = 4.0
    capsule_radius = 3
    capsule_thickness = 0.86999998427927494
    concave_edge_corners = false
    end = [
        "cpu",
        "ram",
        "tray",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "control-center",
        "session"
    ]
    margin_ends = 0
    radius = 3
    start = [ "launcher", "workspaces", "active_window", "media" ]
    thickness = 26

[battery]
warning_threshold = 20

    [battery.device."/org/freedesktop/UPower/devices/keyboard_dev_D1_06_77_6D_73_90"]
    warning_threshold = 0

[dock]
icon_size = 49

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 5

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 8000.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 600.0

[lockscreen]
transition = [ "fade" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@DP-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1024.0
    cy = 993.20013427734375
    output = "DP-1"
    placement_height = 1152.0
    placement_width = 2048.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 665.5
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
avatar_path = "/home/septanto/Pictures/success-program.png"
font_family = "Iosevka Nerd Font"
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    clipboard_position = "auto"
    shadow = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 9.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Gruvbox"
community_palette = "Tomorrow"
mode = "dark"
source = "community"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "kitty", "qt" ]
    community_ids = [ "neovim", "herdr", "yazi" ]

[wallpaper]
directory = "/home/septanto/Pictures"

    [wallpaper.default]
    path = "/home/septanto/Pictures/samurai-mountain.png"

    [wallpaper.last]
    path = "/home/septanto/Pictures/samurai-mountain.png"

    [wallpaper.monitors.DP-1]
    path = "/home/septanto/Pictures/samurai-mountain.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/septanto/Pictures/samurai-mountain.png"

[widget.active_window]
capsule_padding = 14

[widget.clock]
anchor = true
capsule_opacity = 0.17999999999999999

[widget.control-center]
enabled = false

[widget.cpu]
show_tooltip = false
visualization = "none"

[widget.launcher]
glyph = "brand-windows-filled"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.ram]
show_tooltip = false
visualization = "none"

[widget.tray]
enabled = false

[widget.workspaces]
capsule = true
